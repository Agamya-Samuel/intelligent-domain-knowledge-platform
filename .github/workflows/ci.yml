# IDKP CI Pipeline
# Triggers on push to main and all pull requests.
#
# Recommended branch protection rules for `main`:
#   - Require status checks to pass before merging
#   - Require branches to be up to date before merging
#   - Required checks: lint-backend, lint-frontend, test-backend, build

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  lint-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Ruff lint
        run: uv run ruff check app/
      - name: Ruff format check
        run: uv run ruff format --check app/

  # ============================================================
  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npx eslint src/ --max-warnings 0
      - name: TypeScript type check
        run: npx tsc --noEmit

  # ============================================================
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: idkp
          POSTGRES_PASSWORD: idkp_secret
          POSTGRES_DB: idkp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://idkp:idkp_secret@localhost:5432/idkp
          AUTH_SECRET: ci-test-secret
        run: uv run pytest tests/ -v

  # ============================================================
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose build validation
        run: docker compose build
