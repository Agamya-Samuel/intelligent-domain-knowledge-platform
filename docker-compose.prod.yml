# IDKP Docker Compose — Production Stack
# Full production deployment with WAL archiving, resource limits, and log rotation.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml down
#
# Requires:
#   - .env.production file with production secrets
#   - SSL certificates mounted at /etc/letsencrypt/live/<domain>/
#   - Nginx prod config at nginx/nginx.prod.conf
#
# Prerequisites (first deploy only):
#   1. certbot certonly --standalone -d idkp.example.com
#   2. Copy certs to ./certs/ or mount from /etc/letsencrypt

services:
  # ============================================================
  # PostgreSQL 16 — production with WAL archiving and backup
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: idkp-prod-postgres
    restart: always
    ports:
      - "${PROD_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-idkp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-idkp}
    volumes:
      - prod-pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - prod-wal-archive:/var/lib/postgresql/wal_archive
    command: >
      postgres
        -c wal_level=replica
        -c max_wal_senders=3
        -c max_replication_slots=2
        -c archive_mode=on
        -c archive_command='cp %p /var/lib/postgresql/wal_archive/%f'
        -c archive_timeout=300
        -c shared_buffers=256MB
        -c effective_cache_size=1GB
        -c maintenance_work_mem=128MB
        -c checkpoint_completion_target=0.9
        -c random_page_cost=1.1
        -c log_min_duration_statement=500
        -c log_statement=none
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idkp} -d ${POSTGRES_DB:-idkp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - idkp-prod-net

  # ============================================================
  # Redis 7 — production with AOF persistence and memory limit
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: idkp-prod-redis
    restart: always
    ports:
      - "127.0.0.1:${PROD_REDIS_PORT:-6379}:6379"
    command: >
      redis-server
        --appendonly yes
        --appendfsync everysec
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --save 900 1
        --save 300 10
        --save 60 10000
    volumes:
      - prod-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - idkp-prod-net

  # ============================================================
  # Langfuse 2 — production LLM observability
  # ============================================================
  langfuse:
    image: langfuse/langfuse:2
    container_name: idkp-prod-langfuse
    restart: always
    ports:
      - "127.0.0.1:${PROD_LANGFUSE_PORT:-3001}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${PROD_LANGFUSE_URL:-https://langfuse.idkp.example.com}
      SALT: ${LANGFUSE_SALT}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/public/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"
    networks:
      - idkp-prod-net

  # ============================================================
  # Nginx — production reverse proxy with SSL termination
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: idkp-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/fullchain.pem:/etc/ssl/certs/fullchain.pem:ro
      - ./certs/privkey.pem:/etc/ssl/private/privkey.pem:ro
      - nginx-logs:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - idkp-prod-net

volumes:
  prod-pgdata:
    driver: local
  prod-wal-archive:
    driver: local
  prod-redisdata:
    driver: local
  nginx-logs:
    driver: local

networks:
  idkp-prod-net:
    driver: bridge
