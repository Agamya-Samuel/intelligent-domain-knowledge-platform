upstream frontend {
    server host.docker.internal:3000;
}

upstream backend {
    server host.docker.internal:8000;
}

server {
    listen 80;
    server_name _;

    # Increase buffer sizes for SSE/WebSocket
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    # Common proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # API routes -> FastAPI backend
    location /api/ {
        proxy_pass http://backend;
    }

    # WebSocket routes -> FastAPI backend
    location /ws/ {
        proxy_pass http://backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health endpoint (direct backend access for Docker health checks)
    location /health {
        proxy_pass http://backend;
    }

    # All other routes -> Next.js frontend
    location / {
        proxy_pass http://frontend;
    }

    # Next.js HMR WebSocket (development)
    location /_next/webpack-hmr {
        proxy_pass http://frontend/_next/webpack-hmr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
